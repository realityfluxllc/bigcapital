# Metis (RealityFlux) deployment of the SimpleFIN fork.
#
# Derived from docker-compose.prod.yml with these differences:
#   * server/webapp are BUILT from this checkout (fork code incl. SimpleFIN)
#     instead of pulling bigcapitalhq/*:latest from Docker Hub.
#   * database_migration runs from the locally built server image.
#   * No watchtower auto-update (it would replace the built images).
#   * Data lives on bind mounts under ${BIGCAPITAL_DATA_DIR} (snapshotted
#     TrueNAS appdata) instead of named volumes.
#   * Only the Envoy proxy publishes a port (HTTP only; TLS is terminated by
#     Traefik on the host). MariaDB/Redis/ClickHouse/Garage/Gotenberg are
#     reachable only on the compose network.
#
# Run as a Dockhand git stack from the repo root:
#   docker compose -f docker-compose.metis.yml up -d --build
# Env: see .env.metis.example (copy to .env next to this file).

services:
  proxy:
    image: envoyproxy/envoy:v1.30-latest
    depends_on:
      - server
      - webapp
    ports:
      - '${PUBLIC_PROXY_PORT:-8085}:80'
    tty: true
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    restart: unless-stopped
    networks:
      - bigcapital_network

  webapp:
    container_name: bigcapital-webapp
    image: rf/bigcapital-webapp:simplefin
    build:
      context: ./
      dockerfile: packages/webapp/Dockerfile
    pull_policy: never
    restart: unless-stopped
    networks:
      - bigcapital_network

  server:
    container_name: bigcapital-server
    image: rf/bigcapital-server:simplefin
    build:
      context: ./
      dockerfile: packages/server/Dockerfile
    pull_policy: never
    expose:
      - '3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      garage:
        condition: service_started
      database_migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - bigcapital_network
    environment:
      # Mail
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_SECURE=${MAIL_SECURE:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}

      # Database
      - DB_HOST=mysql
      - DB_USER=${DB_USER:?DB_USER is required in .env}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required in .env}
      - DB_CHARSET=${DB_CHARSET:-utf8}

      # System database
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

      # Tenants databases
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}

      # ClickHouse analytics store
      - CLICKHOUSE_ENABLED=${CLICKHOUSE_ENABLED:-false}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required in .env - generate one with openssl rand -base64 32}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-bigcapital_analytics}

      # Authentication
      - 'APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET is required in .env - generate one with openssl rand -base64 48}'

      # Application
      - BASE_URL=${BASE_URL:?BASE_URL is required in .env - the public https URL served by Traefik}

      # Sign-up restrictions
      - SIGNUP_DISABLED=${SIGNUP_DISABLED:-}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS:-}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS:-}

      # Sign-up email confirmation
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-}

      # Gotenberg (Pdf generator)
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - GOTENBERG_DOCS_URL=${GOTENBERG_DOCS_URL:-http://server:3000/public/}

      # Exchange Rate
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE:-}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID:-}

      # Bank Sync
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED:-true}

      # Plaid
      - PLAID_ENV=${PLAID_ENV:-}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK:-}
      - PLAID_CLIENT_NAME=${PLAID_CLIENT_NAME:-}

      # SimpleFIN
      - SIMPLEFIN_ENABLED=${SIMPLEFIN_ENABLED:-true}
      - SIMPLEFIN_SYNC_INTERVAL_HOURS=${SIMPLEFIN_SYNC_INTERVAL_HOURS:-12}
      - SIMPLEFIN_INITIAL_SYNC_DAYS=${SIMPLEFIN_INITIAL_SYNC_DAYS:-90}

      # Lemon Squeez
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY:-}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID:-}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      - HOSTED_ON_BIGCAPITAL_CLOUD=${HOSTED_ON_BIGCAPITAL_CLOUD:-}

      # New Relic matrics tracking.
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-}
      - NEW_RELIC_AI_MONITORING_ENABLED=${NEW_RELIC_AI_MONITORING_ENABLED:-}
      - NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED:-}
      - NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED:-}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-}

      # S3 (Garage)
      - S3_REGION=${S3_REGION:-garage}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}
      - S3_BUCKET=${S3_BUCKET:-bigcapital}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}

      # Stripe
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY:-}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY:-}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID:-}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET:-}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL:-}

      # API rate limiting (see .env.example)
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL:-}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT:-}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL:-}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT:-}

  # Runs the system + tenant migrations from the locally built server image,
  # then exits. `server` waits for this to complete successfully.
  database_migration:
    container_name: bigcapital-database-migration
    image: rf/bigcapital-server:simplefin
    pull_policy: never
    working_dir: /app/packages/server
    command: >
      sh -c "node dist/cli.js system:migrate:latest
          && node dist/cli.js tenants:migrate:latest"
    environment:
      # Database
      - DB_HOST=mysql
      - DB_USER=${DB_USER:?DB_USER is required in .env}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required in .env}
      - DB_CHARSET=${DB_CHARSET:-utf8}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}
      # Tenants databases
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'
    networks:
      - bigcapital_network

  mysql:
    container_name: bigcapital-mysql
    restart: unless-stopped
    build:
      context: ./docker/mariadb
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME:-bigcapital_system}
      - MYSQL_USER=${DB_USER:?DB_USER is required in .env}
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required in .env}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required in .env}
    volumes:
      - ${BIGCAPITAL_DATA_DIR:-/mnt/Scriptorium/appdata/bigcapital}/mysql:/var/lib/mysql
    expose:
      - '3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - bigcapital_network

  redis:
    container_name: bigcapital-redis
    restart: unless-stopped
    build:
      context: ./docker/redis
    expose:
      - '6379'
    volumes:
      - ${BIGCAPITAL_DATA_DIR:-/mnt/Scriptorium/appdata/bigcapital}/redis:/data
    networks:
      - bigcapital_network

  gotenberg:
    container_name: bigcapital-gotenberg
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - bigcapital_network

  garage:
    container_name: bigcapital-garage
    image: dxflrs/garage:v1.3.1
    restart: unless-stopped
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required in .env - generate one with openssl rand -hex 32}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required in .env - generate one with openssl rand -base64 32}
      - S3_BUCKET=${S3_BUCKET:-bigcapital}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./docker/garage/setup.sh:/garage-setup/setup.sh:ro
      - ${BIGCAPITAL_DATA_DIR:-/mnt/Scriptorium/appdata/bigcapital}/garage:/var/lib/garage
    expose:
      - '3900'
      - '3903'
    networks:
      - bigcapital_network

  clickhouse:
    container_name: bigcapital-clickhouse
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required in .env - generate one with openssl rand -base64 32}
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-bigcapital_analytics}
    expose:
      - '8123'
    volumes:
      - ${BIGCAPITAL_DATA_DIR:-/mnt/Scriptorium/appdata/bigcapital}/clickhouse:/var/lib/clickhouse
    networks:
      - bigcapital_network

# Networks
networks:
  bigcapital_network:
    driver: bridge
